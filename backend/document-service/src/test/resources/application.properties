# Test configuration for document-service
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.main.allow-bean-definition-overriding=true

spring.security.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# JWT
fintrack.jwt.secret=C003FA3DC88493379ABFCC2779594D1MYSECRETKEY1233ADMIN

# External services (WireMock)
user.service.url=http://localhost:${wiremock.server.port:8089}
incident.service.url=http://localhost:${wiremock.server.port:8089}
spring.cloud.openfeign.circuitbreaker.enabled=true

# CORS for tests
fintrack.allowed-origins=http://localhost:5173,https://localhost

# Disable caching for tests
spring.cache.type=none

# File storage for tests
document.storage.type=local
document.storage.base-path=${java.io.tmpdir}/fintrack-document-test-attachments

# Les tests utilisent H2 avec ddl-auto=create-drop : les migrations Flyway
# sont ecrites pour PostgreSQL et n'ont pas a s'y appliquer.
spring.flyway.enabled=false
