spring.application.name=FinTrack - Document Service
spring.profiles.active=dev

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8083

# ─── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgresql}:${DB_PORT:5434}/documentservicedb
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ─── Flyway Migration ─────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.0
spring.flyway.locations=classpath:db/migration

# ─── JWT ──────────────────────────────────────────────────────────────────────
fintrack.jwt.secret=${JWT_SECRET}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ─── CORS ─────────────────────────────────────────────────────────────────────
fintrack.allowed-origins=${ALLOWED_ORIGINS}

# ─── File Storage ─────────────────────────────────────────────────────────────
document.storage.base-path=${STORAGE_PATH:/data/fintrack/attachments}
document.storage.type=${DOCUMENT_STORAGE_TYPE:minio}
document.storage.minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
document.storage.minio.access-key=${MINIO_ACCESS_KEY}
document.storage.minio.secret-key=${MINIO_SECRET_KEY}
document.storage.minio.bucket=${MINIO_BUCKET:fintrack-documents}
document.storage.minio.secure=${MINIO_SECURE:false}

# ─── Multipart ────────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=151MB

# ─── External Services ────────────────────────────────────────────────────────
user.service.url=${USER_SERVICE_URL:http://user-service:8081}
incident.service.url=${INCIDENT_SERVICE_URL:http://incident-service:8082}

# ─── Feign ────────────────────────────────────────────────────────────────────
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.timelimiter.configs.default.timeout-duration=10s
spring.cloud.openfeign.client.config.user-service.url=${USER_SERVICE_URL:http://user-service:8081}
spring.cloud.openfeign.client.config.incident-service.url=${INCIDENT_SERVICE_URL:http://incident-service:8082}

# ─── Swagger / OpenAPI ────────────────────────────────────────────────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.shutdown.enabled=false
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true

# ─── i18n ─────────────────────────────────────────────────────────────────────
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.default-locale=en
spring.messages.fallback-to-system-locale=false
