# Configuration de test - désactive Redis pour les tests
fintrack.allowed-origins=http://localhost:5173,http://localhost:5174
# Secrets factices pour le contexte de test (la base n'a plus de défaut : fail-fast prod).
fintrack.jwt.secret=test-secret-0123456789ABCDEF0123456789ABCDEF
fintrack.internal-service.token=test-internal-token
fintrack.security.temp-password-secret=${fintrack.jwt.secret}
spring.cache.type=none
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Désactive la configuration Redis pour les tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Configuration de base de données de test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE,KEY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuration JPA pour les tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Désactive les logs de démarrage
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.cache=WARN
logging.level.org.springframework.data.redis=WARN

# Les slices de test utilisent H2 avec leur propre schema : les migrations Flyway
# sont ecrites pour PostgreSQL. Le test Testcontainers les reactive explicitement.
spring.flyway.enabled=false
