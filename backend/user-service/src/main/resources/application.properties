spring.application.name=FinTrack - User Service
spring.main.allow-circular-references=true
spring.profiles.active=dev

# ─── API Endpoints ────────────────────────────────────────────────────────────
api.basePath=/api/v1/userService
api.endpoints.auth=${api.basePath}/auth
api.endpoints.users=${api.basePath}/users
api.endpoints.agencies=${api.basePath}/agencies
api.endpoints.departments=${api.basePath}/departments
api.endpoints.roles=${api.basePath}/roles
api.endpoints.permissions=${api.basePath}/permissions

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8081

# ─── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgresql}:${DB_PORT:5434}/userservicedb
spring.datasource.username=${DB_USER:postgres}
# Pas de valeur par défaut : le service refuse de démarrer si DB_PASSWORD est absent (fail-fast prod).
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ─── Flyway Migration ─────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.0
spring.flyway.locations=classpath:db/migration
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIME_ZONE:Africa/Lagos}

# ─── Jackson (sérialisation REST) ─────────────────────────────────────────────
spring.jackson.time-zone=${APP_TIME_ZONE:Africa/Lagos}

# ─── JWT / secrets (AUCUN défaut : fail-fast si absent ; valeurs dev dans application-dev) ──
fintrack.jwt.secret=${JWT_SECRET}
fintrack.jwt.expirationMs=${JWT_EXPIRATION:43200000}
fintrack.jwt.refreshExpirationMs=${JWT_REFRESH_EXPIRATION:604800000}
fintrack.jwt.sessionMaxDurationMs=${JWT_SESSION_MAX_DURATION:43200000}
fintrack.internal-service.token=${INTERNAL_SERVICE_TOKEN}
# Secret de chiffrement du mot de passe temporaire (AES-GCM).
fintrack.security.temp-password-secret=${TEMP_PASSWORD_SECRET}

# Cookie de refresh : doit être Secure en prod (COOKIE_SECURE=true), false en dev HTTP local.
fintrack.security.cookie-secure=${COOKIE_SECURE:false}

# ─── CORS (aucun défaut : origines réelles requises en prod) ───────────────────
fintrack.allowed-origins=${ALLOWED_ORIGINS}

# ─── External Services (noms de services Docker : corrects en prod) ────────────
audit.service.url=${AUDIT_SERVICE_URL:http://audit-service:8087}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8084}
reporting.service.url=${REPORTING_SERVICE_URL:http://reporting-service:8085}

# ─── Feign ────────────────────────────────────────────────────────────────────
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.timelimiter.configs.default.timeout-duration=10s
spring.cloud.openfeign.client.config.audit-service.url=${AUDIT_SERVICE_URL:http://audit-service:8087}
spring.cloud.openfeign.client.config.notification-service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8084}
spring.cloud.openfeign.client.config.reporting-service.url=${REPORTING_SERVICE_URL:http://reporting-service:8085}

# ─── Swagger / OpenAPI (désactivé par défaut ; réactivé en profil dev) ─────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ─── Actuator (shutdown jamais exposé/activé) ─────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.shutdown.enabled=false
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true

# ─── i18n ─────────────────────────────────────────────────────────────────────
spring.messages.basename=i18n/messages,i18n/notifications
spring.messages.encoding=UTF-8
spring.messages.default-locale=en
spring.messages.fallback-to-system-locale=false

management.health.mail.enabled=false

# ─── Bootstrap super-admin système ────────────────────────────────────────────
fintrack.bootstrap.super-admin.enabled=${SUPER_ADMIN_BOOTSTRAP_ENABLED:true}
fintrack.bootstrap.super-admin.username=${SUPER_ADMIN_USERNAME:admin}
fintrack.bootstrap.super-admin.email=${SUPER_ADMIN_EMAIL:admin@fintrack.com}
fintrack.bootstrap.super-admin.password=${SUPER_ADMIN_PASSWORD:}
