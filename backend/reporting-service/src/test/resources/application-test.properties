# Test configuration for reporting-service
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE,KEY
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.main.allow-bean-definition-overriding=true

# JWT
fintrack.jwt.secret=C003FA3DC88493379ABFCC2779594D1MYSECRETKEY1233ADMIN

# External services (WireMock)
user.service.url=http://localhost:${wiremock.server.port:8089}
incident.service.url=http://localhost:${wiremock.server.port:8089}
spring.cloud.openfeign.circuitbreaker.enabled=true

# Disable caching in tests
spring.cache.type=none
audit.service.url=http://localhost:${wiremock.server.port:8089}

fintrack.internal-service.token=fintrack-internal-test-token
fintrack.allowed-origins=http://localhost:5173,http://localhost:5174
fintrack.frontend.url=http://localhost:5173

# Les slices de test utilisent H2 avec leur propre schema : les migrations Flyway
# sont ecrites pour PostgreSQL. Le test Testcontainers les reactive explicitement.
spring.flyway.enabled=false
