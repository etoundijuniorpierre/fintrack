spring.application.name=FinTrack - Reporting Service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
fintrack.time-zone=${APP_TIME_ZONE:Africa/Lagos}
fintrack.report.retention-cleanup-cron=${REPORT_RETENTION_CLEANUP_CRON:0 0 21 * * *}

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8085

# ─── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgresql}:${DB_PORT:5434}/reportingservicedb
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ─── Flyway Migration ─────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.0
spring.flyway.locations=classpath:db/migration

# ─── JWT ──────────────────────────────────────────────────────────────────────
fintrack.jwt.secret=${JWT_SECRET}
fintrack.internal-service.token=${INTERNAL_SERVICE_TOKEN}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ─── CORS ─────────────────────────────────────────────────────────────────────
fintrack.allowed-origins=${ALLOWED_ORIGINS}

# ─── External Services ────────────────────────────────────────────────────────
user.service.url=${USER_SERVICE_URL:http://user-service:8081}
incident.service.url=${INCIDENT_SERVICE_URL:http://incident-service:8082}
document.service.url=${DOCUMENT_SERVICE_URL:http://document-service:8083}
audit.service.url=${AUDIT_SERVICE_URL:http://audit-service:8087}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8084}
fintrack.frontend.url=${FRONTEND_URL}

# ─── Feign ────────────────────────────────────────────────────────────────────
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=15000
spring.cloud.openfeign.client.config.incident-service.read-timeout=${INCIDENT_SERVICE_READ_TIMEOUT_MS:30000}
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.timelimiter.configs.default.timeout-duration=15s
resilience4j.timelimiter.instances.IncidentServiceClientgetIncidents.timeout-duration=${INCIDENT_SERVICE_TIME_LIMIT:30s}
spring.cloud.openfeign.client.config.user-service.url=${USER_SERVICE_URL:http://user-service:8081}
spring.cloud.openfeign.client.config.incident-service.url=${INCIDENT_SERVICE_URL:http://incident-service:8082}
spring.cloud.openfeign.client.config.document-service.url=${DOCUMENT_SERVICE_URL:http://document-service:8083}
spring.cloud.openfeign.client.config.audit-service.url=${AUDIT_SERVICE_URL:http://audit-service:8087}
spring.cloud.openfeign.client.config.notification-service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8084}

# ─── Swagger / OpenAPI ────────────────────────────────────────────────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true

# ─── i18n ─────────────────────────────────────────────────────────────────────
spring.messages.basename=i18n/messages,i18n/notifications
spring.messages.encoding=UTF-8
spring.messages.default-locale=en
spring.messages.fallback-to-system-locale=false

# ─── Super Admin / réglages infra (non éditables en UI, surchargeables par env) ───
fintrack.superadmin.stats-sample-size=${SUPERADMIN_STATS_SAMPLE_SIZE:20}
fintrack.superadmin.reports-fetch-size=${SUPERADMIN_REPORTS_FETCH_SIZE:1000}
fintrack.superadmin.health-probe-timeout-ms=${SUPERADMIN_HEALTH_PROBE_TIMEOUT_MS:2000}
fintrack.cache.maximum-size=${CACHE_MAXIMUM_SIZE:256}
fintrack.report.error-stack-max-frames=${REPORT_ERROR_STACK_MAX_FRAMES:20}
fintrack.report.error-stack-max-chars=${REPORT_ERROR_STACK_MAX_CHARS:2048}
fintrack.superadmin.incident-fetch-size=${SUPERADMIN_INCIDENT_FETCH_SIZE:1000}
fintrack.audit.export-page-size=${AUDIT_EXPORT_PAGE_SIZE:500}
