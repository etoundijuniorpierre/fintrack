# Test configuration for audit-service
# Flapdoodle embedded MongoDB is auto-configured by Spring Boot test slice
spring.data.mongodb.auto-index-creation=true
spring.mongodb.representation.uuid=standard

spring.main.allow-bean-definition-overriding=true

spring.security.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# JWT
fintrack.jwt.secret=C003FA3DC88493379ABFCC2779594D1MYSECRETKEY1233ADMIN
fintrack.internal-service.token=fintrack-internal-test-token

# External services (WireMock)
user.service.url=http://localhost:${wiremock.server.port:8089}
spring.cloud.openfeign.circuitbreaker.enabled=true

# i18n
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Disable caching in tests
spring.cache.type=none

fintrack.allowed-origins=http://localhost:5173,http://localhost:5174
