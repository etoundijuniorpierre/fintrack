# ===== Erreurs Générales =====
error.internal_server_error=Une erreur technique inattendue est survenue.
error.invalid_input=Les données fournies sont invalides.
error.validation_failed=La validation a échoué pour un ou plusieurs champs.
error.constraint_violation=Une contrainte de validation a été violée.
error.data_integrity=L'opération entre en conflit avec les contraintes de données existantes.
error.method_not_allowed=La méthode HTTP utilisée n'est pas autorisée pour cette ressource.
error.malformed_request=Le corps de la requête est absent ou mal formé.
error.missing_parameter=Un paramètre obligatoire est manquant.
error.invalid_parameter=La valeur d'un paramètre est invalide.
error.permission_denied=Vous n'avez pas la permission d'accéder à cette ressource.

# ===== Audit =====
error.entity.not_found=La ressource demandée n'existe pas.
error.audit_log.not_found=Le log d'audit demandé n'existe pas.
error.duplicate_resource=Cette ressource existe déjà.
error.business_rule_violation=Une règle métier a été violée.

# ===== Validation =====
validation.not_blank=Ce champ est obligatoire.
validation.size.max=La taille maximale est de {max} caractères.

