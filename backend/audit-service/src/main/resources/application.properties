spring.application.name=FinTrack - Audit Service
spring.profiles.active=dev

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8087

# ─── MongoDB ──────────────────────────────────────────────────────────────────
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27019/auditservicedb}
spring.mongodb.auto-index-creation=true
spring.docker.compose.enabled=false

# ─── Jackson (sérialisation REST) ─────────────────────────────────────────────
spring.jackson.time-zone=${APP_TIME_ZONE:Africa/Lagos}

# ─── JWT ──────────────────────────────────────────────────────────────────────
fintrack.jwt.secret=${JWT_SECRET}
fintrack.internal-service.token=${INTERNAL_SERVICE_TOKEN}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ─── CORS ─────────────────────────────────────────────────────────────────────
fintrack.allowed-origins=${ALLOWED_ORIGINS}

# ─── External Services ────────────────────────────────────────────────────────
user.service.url=${USER_SERVICE_URL:http://user-service:8081}

# ─── Feign ────────────────────────────────────────────────────────────────────
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.timelimiter.configs.default.timeout-duration=10s
spring.cloud.openfeign.client.config.user-service.url=${USER_SERVICE_URL:http://user-service:8081}

# ─── Swagger / OpenAPI ────────────────────────────────────────────────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.shutdown.enabled=false
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true

# ─── i18n ─────────────────────────────────────────────────────────────────────
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.default-locale=en
spring.messages.fallback-to-system-locale=false
