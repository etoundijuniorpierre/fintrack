spring.application.name=FinTrack - Incident Service
spring.profiles.active=dev
spring.main.allow-circular-references=true

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8082

# ─── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgresql}:${DB_PORT:5434}/incidentservicedb
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# ─── Flyway Migration ─────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.0
spring.flyway.locations=classpath:db/migration


spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIME_ZONE:Africa/Lagos}

# ─── Jackson (sérialisation REST) ─────────────────────────────────────────────
spring.jackson.time-zone=${APP_TIME_ZONE:Africa/Lagos}

# ─── JWT ──────────────────────────────────────────────────────────────────────
fintrack.jwt.secret=${JWT_SECRET}
fintrack.internal-service.token=${INTERNAL_SERVICE_TOKEN}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ─── CORS ─────────────────────────────────────────────────────────────────────
fintrack.allowed-origins=${ALLOWED_ORIGINS}

# ─── Super Admin defaults SLA ───
system.defaults.sla-hours=${DEFAULT_SLA_HOURS:48}

# Reserve l'attente prolongee aux incidents declares a partir de cette date (ISO, date
# ou horodatage). Vide = tout le stock est eligible. A renseigner au deploiement pour
# que le backlog anterieur ne bascule pas en bloc dans un dispositif dont la sortie
# exige desormais une confirmation d'actualite de l'entite source.
incident.prolonged-wait.applies-from=${PROLONGED_WAIT_APPLIES_FROM:2026-09-07}

# ─── External Services ────────────────────────────────────────────────────────
user.service.url=${USER_SERVICE_URL:http://user-service:8081}
audit.service.url=${AUDIT_SERVICE_URL:http://audit-service:8087}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8084}
reporting.service.url=${REPORTING_SERVICE_URL:http://reporting-service:8085}
app.frontend.url=${FRONTEND_URL}

# ─── Feign ────────────────────────────────────────────────────────────────────
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.user-service.url=${USER_SERVICE_URL:http://user-service:8081}
spring.cloud.openfeign.client.config.audit-service.url=${AUDIT_SERVICE_URL:http://audit-service:8087}
spring.cloud.openfeign.client.config.notification-service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8084}
spring.cloud.openfeign.client.config.reporting-service.url=${REPORTING_SERVICE_URL:http://reporting-service:8085}

# ─── Circuit Breaker ──────────────────────────────────────────────────────────
resilience4j.circuitbreaker.instances.default.sliding-window-size=10
resilience4j.circuitbreaker.instances.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.timelimiter.configs.default.timeout-duration=10s

# ─── Swagger / OpenAPI ────────────────────────────────────────────────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics,caches
management.endpoint.shutdown.enabled=false
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.enable.feign=true
management.metrics.enable.cache=true
management.metrics.cache.instrument=caffeine

# ─── i18n ─────────────────────────────────────────────────────────────────────
spring.messages.basename=i18n/messages,i18n/notifications
spring.messages.encoding=UTF-8
spring.messages.default-locale=en
spring.messages.fallback-to-system-locale=false
