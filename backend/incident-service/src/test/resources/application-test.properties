# Test datasource - H2 in-memory
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA for tests - use custom schema to avoid H2 CHECK constraint issues
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
spring.jpa.properties.hibernate.check_nullability=false
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.sql.init.mode=always

# JWT
fintrack.jwt.secret=C003FA3DC88493379ABFCC2779594D1MYSECRETKEY1233ADMIN

# Les clients Feign ne sont pas appeles par les slices MVC mais leurs URL doivent etre resolues.
user.service.url=http://localhost:8089
audit.service.url=http://localhost:8089
notification.service.url=http://localhost:8089
reporting.service.url=http://localhost:8089
spring.cloud.openfeign.circuitbreaker.enabled=true
# Le circuit breaker reste fermé pendant les tests (fenêtre jamais atteinte) afin
# que le fallback se déclenche par exception et non par ouverture du circuit —
# évite la fuite d'état entre méthodes de test.
resilience4j.circuitbreaker.instances.default.minimum-number-of-calls=1000
resilience4j.circuitbreaker.instances.default.sliding-window-size=1000

fintrack.internal-service.token=fintrack-internal-test-token
fintrack.allowed-origins=http://localhost:5173,http://localhost:5174
app.frontend.url=http://localhost:5173

# Les slices de test utilisent H2 avec leur propre schema : les migrations Flyway
# sont ecrites pour PostgreSQL. Le test Testcontainers les reactive explicitement.
spring.flyway.enabled=false
