spring.application.name=FinTrack - Notification Service
spring.profiles.active=dev

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8084

# ─── MongoDB ──────────────────────────────────────────────────────────────────
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27019/notificationservicedb}
spring.mongodb.auto-index-creation=true
spring.docker.compose.enabled=false

# ─── Mail (SMTP — provider-agnostique : Gmail, Brevo, SES, SendGrid…) ─────────
# Par défaut : SMTP Gmail (App Password requis). Changer de provider = changer ces
# variables d'env, sans recompiler.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
# Expéditeur affiché. Si vide, l'adresse d'authentification (username) est utilisée.
spring.mail.from=${SMTP_FROM:}
fintrack.mail.from-name=${MAIL_FROM_NAME:FinTrack}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Hôte(s) de confiance pour le TLS SMTP. Contourne « PKIX path building failed » quand le
# réseau intercepte le TLS SMTP (cert non reconnu par la JVM). Mettre "*" si l'hôte exact varie.
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_SSL_TRUST:${SMTP_HOST:smtp.gmail.com}}
# Timeouts (ms) pour éviter tout blocage du thread d'envoi.
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECT_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:10000}

# ─── JWT ──────────────────────────────────────────────────────────────────────
fintrack.jwt.secret=${JWT_SECRET}
fintrack.internal-service.token=${INTERNAL_SERVICE_TOKEN}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
fintrack.allowed-origins=${ALLOWED_ORIGINS}

# ─── External Services ────────────────────────────────────────────────────────
incident.service.url=${INCIDENT_SERVICE_URL:http://incident-service:8082}
reporting.service.url=${REPORTING_SERVICE_URL:http://reporting-service:8085}

# ─── Feign ────────────────────────────────────────────────────────────────────
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.timelimiter.configs.default.timeout-duration=10s
spring.cloud.openfeign.client.config.incident-service.url=${INCIDENT_SERVICE_URL:http://incident-service:8082}
spring.cloud.openfeign.client.config.reporting-service.url=${REPORTING_SERVICE_URL:http://reporting-service:8085}

# ─── Swagger / OpenAPI ────────────────────────────────────────────────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.shutdown.enabled=false
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true

# ─── i18n ─────────────────────────────────────────────────────────────────────
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.default-locale=en
spring.messages.fallback-to-system-locale=false

# ─── Réglage infra (non éditable en UI) ───
fintrack.notification.failed-scan-page-size=${NOTIFICATION_FAILED_SCAN_PAGE_SIZE:50}
