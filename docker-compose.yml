services:
  # ===== DATABASE INITIALIZATION SERVICE =====
  db-init:
    image: docker:24-cli
    container_name: fintrack-db-init
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
    working_dir: /app
    environment:
      - TZ=${APP_TIME_ZONE:-Africa/Lagos}
      - DB_USER=${DB_USER:?DB_USER is required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - MONGO_ROOT_USER=${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      - POSTGRES_MULTIPLE_DATABASES=userservicedb,incidentservicedb,documentservicedb,reportingservicedb
    command: sh -c "sh scripts/init-db.sh"
    depends_on:
      postgresql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - fintrack-network
    restart: "no"

  # ===== REVERSE PROXY =====
  nginx:
    image: nginx:1.24-alpine
    container_name: fintrack-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    environment:
      - TZ=${APP_TIME_ZONE:-Africa/Lagos}
      - FINTRACK_DNS_NAME=${FINTRACK_DNS_NAME:-finstar.fintrack.org}
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - fintrack-network
    restart: unless-stopped
    profiles:
      - prod

  # ===== FRONTEND (production — nginx static) =====
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: fintrack-frontend
    expose:
      - "80"
    environment:
      - TZ=${APP_TIME_ZONE:-Africa/Lagos}
    depends_on:
      user-service:
        condition: service_healthy
    networks:
      - fintrack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ===== USER SERVICE =====
  user-service:
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    container_name: fintrack-user-service
    expose:
      - "8081"
    environment:
      - APP_TIME_ZONE=${APP_TIME_ZONE:-Africa/Lagos}
      - TZ=${APP_TIME_ZONE:-Africa/Lagos}
      - JAVA_TOOL_OPTIONS=-Duser.timezone=${APP_TIME_ZONE:-Africa/Lagos}
      - SPRING_PROFILES_ACTIVE=${COMPOSE_PROFILES:?COMPOSE_PROFILES is required}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5434/userservicedb
      - SPRING_DATASOURCE_USERNAME=${DB_USER:?DB_USER is required}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-43200000}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-604800000}
      - JWT_SESSION_MAX_DURATION=${JWT_SESSION_MAX_DURATION:-43200000}
      - TEMP_PASSWORD_SECRET=${TEMP_PASSWORD_SECRET:?TEMP_PASSWORD_SECRET is required}
      - COOKIE_SECURE=${COOKIE_SECURE:?COOKIE_SECURE is required}
      - SPRING_MAIL_HOST=${SMTP_HOST:?SMTP_HOST is required}
      - SPRING_MAIL_PORT=${SMTP_PORT:?SMTP_PORT is required}
      - SPRING_MAIL_USERNAME=${SMTP_USERNAME:?SMTP_USERNAME is required}
      - SPRING_MAIL_PASSWORD=${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      - MANAGEMENT_HEALTH_MAIL_ENABLED=false
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - SUPER_ADMIN_BOOTSTRAP_ENABLED=${SUPER_ADMIN_BOOTSTRAP_ENABLED:?SUPER_ADMIN_BOOTSTRAP_ENABLED is required}
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME:?SUPER_ADMIN_USERNAME is required}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:?SUPER_ADMIN_EMAIL is required}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD is required}
    depends_on:
      postgresql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - fintrack-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8081/actuator/health",
        ]
      interval: 25s
      timeout: 15s
      retries: 10
      start_period: ${BACKEND_HEALTH_START_PERIOD:-300s}

  # ===== INCIDENT SERVICE =====
  incident-service:
    build:
      context: ./backend
      dockerfile: incident-service/Dockerfile
    container_name: fintrack-incident-service
    expose:
      - "8082"
    environment:
      - APP_TIME_ZONE=${APP_TIME_ZONE:-Africa/Lagos}
      - TZ=${APP_TIME_ZONE:-Africa/Lagos}
      - JAVA_TOOL_OPTIONS=-Duser.timezone=${APP_TIME_ZONE:-Africa/Lagos}
      - SPRING_PROFILES_ACTIVE=${COMPOSE_PROFILES:?COMPOSE_PROFILES is required}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5434/incidentservicedb
      - SPRING_DATASOURCE_USERNAME=${DB_USER:?DB_USER is required}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - USER_SERVICE_URL=http://user-service:8081
      - AUDIT_SERVICE_URL=http://audit-service:8087
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
    depends_on:
      postgresql:
        condition: service_healthy
      user-service:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - fintrack-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8082/actuator/health",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: ${BACKEND_HEALTH_START_PERIOD:-300s}

  # ===== DOCUMENT SERVICE =====
  document-service:
    build:
      context: ./backend
      dockerfile: document-service/Dockerfile
    container_name: fintrack-document-service
    expose:
      - "8083"
    environment:
      - APP_TIME_ZONE=${APP_TIME_ZONE:-Africa/Lagos}
      - TZ=${APP_TIME_ZONE:-Africa/Lagos}
      - JAVA_TOOL_OPTIONS=-Duser.timezone=${APP_TIME_ZONE:-Africa/Lagos}
      - SPRING_PROFILES_ACTIVE=${COMPOSE_PROFILES:?COMPOSE_PROFILES is required}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5434/documentservicedb
      - SPRING_DATASOURCE_USERNAME=${DB_USER:?DB_USER is required}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - DOCUMENT_STORAGE_TYPE=minio
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_BUCKET=fintrack-documents
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
    depends_on:
      postgresql:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - fintrack-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8083/actuator/health",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: ${BACKEND_HEALTH_START_PERIOD:-300s}

  # ===== NOTIFICATION SERVICE =====
  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: fintrack-notification-service
    expose:
      - "8084"
    environment:
      - APP_TIME_ZONE=${APP_TIME_ZONE:-Africa/Lagos}
      - TZ=${APP_TIME_ZONE:-Africa/Lagos}
      - JAVA_TOOL_OPTIONS=-Duser.timezone=${APP_TIME_ZONE:-Africa/Lagos}
      - SPRING_PROFILES_ACTIVE=${COMPOSE_PROFILES:?COMPOSE_PROFILES is required}
      - SPRING_MONGODB_URI=mongodb://${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}@mongodb:27019/notificationservicedb?authSource=admin
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - INCIDENT_SERVICE_URL=http://incident-service:8082
      - SMTP_HOST=${SMTP_HOST:?SMTP_HOST is required}
      - SMTP_PORT=${SMTP_PORT:?SMTP_PORT is required}
      - SMTP_USERNAME=${SMTP_USERNAME:?SMTP_USERNAME is required}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      - SMTP_FROM=${SMTP_FROM:?SMTP_FROM is required}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-FinTrack}
      - SMTP_SSL_TRUST=${SMTP_SSL_TRUST:?SMTP_SSL_TRUST is required}
      - MANAGEMENT_HEALTH_MAIL_ENABLED=false

    depends_on:
      mongodb:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - fintrack-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8084/actuator/health",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: ${BACKEND_HEALTH_START_PERIOD:-300s}

  # ===== REPORTING SERVICE =====
  reporting-service:
    build:
      context: ./backend
      dockerfile: reporting-service/Dockerfile
    container_name: fintrack-reporting-service
    expose:
      - "8085"
    environment:
      - APP_TIME_ZONE=${APP_TIME_ZONE:-Africa/Lagos}
      - TZ=${APP_TIME_ZONE:-Africa/Lagos}
      - JAVA_TOOL_OPTIONS=-Duser.timezone=${APP_TIME_ZONE:-Africa/Lagos}
      - REPORT_RETENTION_CLEANUP_CRON=${REPORT_RETENTION_CLEANUP_CRON:?REPORT_RETENTION_CLEANUP_CRON is required}
      - SPRING_PROFILES_ACTIVE=${COMPOSE_PROFILES:?COMPOSE_PROFILES is required}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5434/reportingservicedb
      - SPRING_DATASOURCE_USERNAME=${DB_USER:?DB_USER is required}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - EXPORT_PATH=/data/fintrack/exports
      - AUDIT_SERVICE_URL=http://audit-service:8087
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required}
      - INCIDENT_SERVICE_READ_TIMEOUT_MS=${INCIDENT_SERVICE_READ_TIMEOUT_MS:-30000}
      - INCIDENT_SERVICE_TIME_LIMIT=${INCIDENT_SERVICE_TIME_LIMIT:-30s}
      # Sauvegarde : acces direct aux deux bases + destination Backblaze B2.
      - BACKUP_DIR=/data/fintrack/backups
      - BACKUP_DB_HOST=postgresql
      - BACKUP_DB_PORT=5434
      - BACKUP_DB_USER=${DB_USER:?DB_USER is required}
      - BACKUP_DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - BACKUP_MONGO_HOST=mongodb
      - BACKUP_MONGO_PORT=27019
      - BACKUP_MONGO_USER=${MONGO_ROOT_USER:-}
      - BACKUP_MONGO_PASSWORD=${MONGO_ROOT_PASSWORD:-}
      - B2_BUCKET_NAME=${B2_BUCKET_NAME:-}
      - B2_KEY_ID=${B2_KEY_ID:-}
      - B2_APPLICATION_KEY=${B2_APPLICATION_KEY:-}
    volumes:
      - exports:/data/fintrack/exports
      - backups:/data/fintrack/backups
    depends_on:
      postgresql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - fintrack-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8085/actuator/health",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: ${BACKEND_HEALTH_START_PERIOD:-300s}

  # ===== AUDIT SERVICE =====
  audit-service:
    build:
      context: ./backend
      dockerfile: audit-service/Dockerfile
    container_name: fintrack-audit-service
    expose:
      - "8087"
    environment:
      - APP_TIME_ZONE=${APP_TIME_ZONE:-Africa/Lagos}
      - TZ=${APP_TIME_ZONE:-Africa/Lagos}
      - JAVA_TOOL_OPTIONS=-Duser.timezone=${APP_TIME_ZONE:-Africa/Lagos}
      - SPRING_PROFILES_ACTIVE=${COMPOSE_PROFILES:?COMPOSE_PROFILES is required}
      - SPRING_MONGODB_URI=mongodb://${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}@mongodb:27019/auditservicedb?authSource=admin
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - USER_SERVICE_URL=http://user-service:8081
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}

    depends_on:
      mongodb:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - fintrack-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8087/actuator/health",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: ${BACKEND_HEALTH_START_PERIOD:-300s}

  # ===== POSTGRESQL =====
  postgresql:
    image: postgres:17
    container_name: fintrack-postgresql
    environment:
      - TZ=${APP_TIME_ZONE:-Africa/Lagos}
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${DB_USER:?DB_USER is required}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - POSTGRES_MULTIPLE_DATABASES=userservicedb,incidentservicedb,documentservicedb,reportingservicedb
      - PGPORT=5434
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    expose:
      - "5434"
    networks:
      - fintrack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -p 5434"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===== MONGODB =====
  mongodb:
    image: mongo:7
    container_name: fintrack-mongodb
    environment:
      - TZ=${APP_TIME_ZONE:-Africa/Lagos}
      - MONGO_INITDB_DATABASE=admin
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    command: ["mongod", "--port", "27019"]
    expose:
      - "27019"
    networks:
      - fintrack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27019 -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== MINIO =====
  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: fintrack-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - TZ=${APP_TIME_ZONE:-Africa/Lagos}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data
    networks:
      - fintrack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: fintrack-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set fintrack http://minio:9000 ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required} ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required};
      mc mb -p fintrack/fintrack-documents;
      exit 0;
      "
    networks:
      - fintrack-network

# ===== VOLUMES =====
volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  exports:
    driver: local
  backups:
    driver: local
  minio-data:
    driver: local

# ===== NETWORKS =====
networks:
  fintrack-network:
    driver: bridge
